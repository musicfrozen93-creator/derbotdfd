# Deriv Market Condition Analyzer — configuration
# Secrets (Telegram token / chat id) go in .env, never here.

deriv:
  # Public, read-only WebSocket (verified live 2026-11-16). No API token is used.
  ws_url: wss://api.derivws.com/trading/v1/options/ws/public
  request_timeout_s: 30
  open_timeout_s: 20
  ping_interval_s: 30            # app-level {"ping": 1}
  idle_reconnect_s: 60           # reconnect if nothing at all is received for this long
  reconnect_backoff_min_s: 1
  reconnect_backoff_max_s: 60
  rate_limit_general_per_min: 150   # Deriv docs: 220/min shared by non-proposal calls
  rate_limit_proposal_per_min: 30   # quotes only; live test 2026-11-16 hit RateLimit at ~80 quotes in <30 s

discovery:
  interval_minutes: 360          # re-run active_symbols + contracts_for every 6 h
  markets: [synthetic_index]     # Deriv "market" values to consider
  # Deriv "submarket" values to consider, as returned by active_symbols. random_index = Continuous
  # Indices (R_10 ... R_100 and the 1-second 1HZ...V indices). This excludes Jump (jump_index),
  # Crash/Boom (crash_index), Range Break (range_index), Daily Reset (random_daily), Step
  # (step_index), Forex Basket (forex_basket) and Commodities Basket (commodity_basket).
  # New Continuous Indices listed by Deriv are picked up automatically at the next discovery.
  include_submarkets: [random_index]
  # 1-second Continuous Indices allowed (the API lists them in random_index too). Only those the
  # original bot XML files trade: 1HZ10V (Aria, Aria V2, Predator) and 1HZ50V (Zony AI).
  # Other 1HZ symbols are skipped. Use [] to skip all of them.
  one_second_symbols: [1HZ10V, 1HZ50V]
  exclude_symbols: []
  priority_symbols: [R_100, R_10, 1HZ10V, 1HZ50V]   # the bots' original symbols are served first
  max_symbols: 40

collection:
  flush_interval_s: 1.0
  bootstrap_target_ticks: 400000  # history fetched per symbol on first start (~4.6 days at 1 tick/s)
  bootstrap_max_days: 14
  history_page_size: 1000         # the public API returns at most 1,000 ticks per request
  gap_audit_interval_minutes: 10
  gap_audit_lookback_hours: 6
  retention_days: 30

data_quality:
  gap_factor: 10                 # gap = interval > 10 x nominal (10 s on 1s indices, 20 s on 2 s indices)
  missing_factor: 1.5            # live "missing tick" log threshold
  stale_factor: 10
  critical_stale_s: 120          # no ticks for this long -> FAULT -> critical alert + immediate STOP
  critical_disconnect_s: 120

analysis:
  interval_s: 60                 # every combination is checked once a minute
  risk_streak: 6                 # losing streak used for the stake-ladder line in START messages

# Legacy digit rule ("every winning digit > 10 % of the last 500 ticks"). Since the strategy
# alignment it is computed and shown for information only and gates nothing: past digit
# frequencies do not change the next digit (see ANALYZER_STRATEGY_ALIGNMENT reports).
# window_ticks is still the RECENT window used by the bot-specific statistics and the minimum
# amount of data before a combination is evaluated.
signal_rule:
  mode: individual
  threshold_pct: 10              # legacy rule only
  window_ticks: 500              # recent window (ticks)
  contracts: all                 # legacy rule only

# Bot-specific evaluation (app/strategy_model/evaluate.py). Every bot x market gets five separate
# verdicts: A entry (the bot's own XML entry rule), B statistics (outcomes of the bot's own entry
# ticks, settled on the correct tick), C economics (live Deriv quote at the bot's real stake ->
# expected value), D risk (can the bot's recovery sequence be executed), E decision.
evaluation:
  long_window_ticks: 100000      # long window for B and C (about 1.2 days at 1 tick/s, 2.3 days at 2 s)
  confidence: 0.99               # Wilson interval level (two-sided for B, one-sided bounds for C)
  min_outcomes: 100              # fewer settled entries than this -> NOT_CHECKED
  entry_gap_ticks: 1             # contract entry = the tick after the trigger tick (DBot timing)
  # gates required for START; 'risk' is mandatory. Default: entry + statistics + economics + risk.
  # With fair digits economics is never POSITIVE (Deriv's commission), so the default sends no START.
  start_requires: [entry, statistics, economics, risk]

# Live payout quotes (public proposal calls, no token, nothing bought), rate-limited by
# deriv.rate_limit_proposal_per_min. A quote older than max_quote_age_hours counts as missing.
economics:
  currency: USD
  refresh_hours: 6
  max_quote_age_hours: 24
  retry_seconds: 60

# Recovery / risk check of every bot's own stake ladder.
risk:
  bankroll_usd: null             # balance available to a bot (USD). null = UNKNOWN -> no START
  bankroll_per_bot: {}           # e.g. {aria: 500, delta: 100}
  base_stakes: {}                # your Base Stake if you changed it in DBot, e.g. {predator: 2}
  max_payout_override: null      # your account's maximum payout if a demo quote shows a different one
  min_stake_override: null
  max_ladder_steps: 60

signals:
  start_confirm_cycles: 3        # consecutive passing checks (rule met) before START
  stop_confirm_cycles: 3         # consecutive failing checks before STOP (critical faults: immediate)
  restart_cooldown_minutes: 30   # minimum time between a STOP and the next START of the same combination
  startup_grace_s: 300           # after a restart, hold data-fault STOPs while back-fill catches up
  offline_stop_s: 120            # analyzer itself down this long -> active signals get a critical STOP on restart

telegram:
  enabled: true
  timezone: Asia/Colombo
  daily_summary: false
  daily_summary_time: "08:00"
  send_timeout_s: 15
  max_attempts: 20
  critical_alerts: true
  error_alert_cooldown_minutes: 60

storage:
  db_path: data/analyzer.db

logging:
  dir: logs
  level: INFO
  max_bytes: 10485760
  backups: 10

strategies:
  dir: strategies
  enabled: [all]                 # or a list of keys, e.g. [aria, aria_v2, navix]

heartbeat:
  file: data/heartbeat.json
  interval_s: 30
  silence_alert_minutes: 5
